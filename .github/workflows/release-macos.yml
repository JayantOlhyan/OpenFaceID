name: Release macOS Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.1-rc.1)'
        required: true
        default: 'v0.2.1-rc.1'

permissions:
  contents: write

jobs:
  build-macos-release:
    name: Build & Package macOS (Apple Silicon arm64)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

      - name: Build macOS Application Bundle
        run: ./scripts/build-macos.sh

      - name: Package macOS DMG & ZIP
        run: ./scripts/package-macos.sh

      - name: Verify Checksums
        run: |
          echo "Generated Release Checksums:"
          cat dist/SHA256SUMS

      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/macos/OpenFaceID-*.dmg
            dist/macos/OpenFaceID-*.zip
            dist/SHA256SUMS
          name: "OpenFaceID ${{ github.ref_name || inputs.tag_name }}"
          draft: false
          prerelease: true
          generate_release_notes: true
